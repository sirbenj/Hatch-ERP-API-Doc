openapi: 3.0.3
info:
  title: Hatchafrica – Business Central API
  description: >
    Integration API on top of Microsoft Dynamics 365 Business Central for
    AGP Poultry PLC (Ethiopia).
  version: "1.0.0.1"
  contact:
    name: Hatch Africa Enterprise Technology
externalDocs:
  description: ""
  url: ""
servers:
  - url: https://api.businesscentral.dynamics.com/v2.0/{TENAT_ID}/{Environment}
    description: >
      The Tenant ID and Environment Name are provided in a separate document,
      along with the client credentials.
tags:
  - name: Companies
  - name: Customers
  - name: Products
  - name: Sales Quotes
  - name: Sales Orders
  - name: Payments
  - name: Reference Data

paths:
  /api/ech/echgroup/v1.0/companies:
    get:
      tags: [Companies]
      summary: List companies accessible to this app registration
      description: Tenant-wide; no company parameter needed.
      operationId: listCompanies
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        displayName:
                          type: string

  /ODataV4/Company('AGP%20Poultry%20PLC%20%28Ethiopia%29')/customers:
    get:
      tags: [Customers]
      summary: List customers, or a single customer via $filter
      operationId: listCustomers
      parameters:
        - name: $filter
          in: query
          description: >
            e.g. `customerNo eq 'AGP-A00002'` to fetch a single customer.
          schema:
            type: string
          example: "customerNo eq 'AGP-A00002'"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      $ref: '#/components/schemas/Customer'

  /ODataV4/Company('AGP%20Poultry%20PLC%20%28Ethiopia%29')/createCustomerAgent:
    post:
      tags: [Customers]
      summary: Create a customer (Agent)
      description: >
        `customerNo` is system-generated (No. Series) — do not rely on any
        value you send. `priceGroup` is mandatory and must be exactly
        `AGENT`, `DEALER`, or `AGENT-DEAL`. Posting-group fields are
        hard-coded to `LOCAL` regardless of input.
      operationId: createCustomerAgent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
            example:
              name: Eusubalewu Amenu
              salesPersonCode: YA001
              phoneNumber: "+251936934945"
              dateOfBirth: "1999-10-12"
              gender: Male
              addressOne: Dilla Zuriya
              addressTwo: Dilla Zuria
              city: Gedeo
              country: ET
              postCode: DILLA ZURIA
              territory: SERS
              priceGroup: AGENT
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

  /ODataV4/Company('AGP%20Poultry%20PLC%20%28Ethiopia%29')/createCustomerAgent/{customerNo}:
    patch:
      tags: [Customers]
      summary: Update a customer
      operationId: updateCustomer
      parameters:
        - name: customerNo
          in: path
          required: true
          schema:
            type: string
            maxLength: 20
          example: AGP-A00001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
            example:
              customerNo: AGP-A00001
              companyName: AGP Poultry PLC (Ethiopia)
              companyId: 12345678-abcd-ef01-2345-6789abcdef01
              name: Eusubalewu Amenu
              salesPersonCode: YA001
              email: eusubalewu@example.com
              phoneNumber: "+251936934945"
              phoneNumber2: ""
              alternativePhoneNo: ""
              alternativePhoneNo2: ""
              country: ET
              territory: SERS
              city: Gedeo
              postCode: DILLA ZURIA
              addressOne: Dilla Zuriya
              addressTwo: Dilla Zuria
              balance: 0
              status: Open
              dateOfBirth: "1999-10-12"
              gender: Male
              tin: ""
              priceGroup: AGENT
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerUpdate'

  /ODataV4/Company('AGP%20Poultry%20PLC%20%28Ethiopia%29')/createCustomerDealer:
    post:
      tags: [Customers]
      summary: Create a customer (Dealer)
      operationId: createCustomerDealer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
            example:
              name: Abdi hussein
              salesPersonCode: AH001
              phoneNumber: "+251915674330"
              dateOfBirth: "1987-08-11"
              gender: Male
              addressOne: Gadullo
              addressTwo: Gadullo
              city: West Hararghe
              country: ET
              postCode: DAROLABU
              territory: TIG
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

  /ODataV4/Company('AGP%20Poultry%20PLC%20%28Ethiopia%29')/products:
    get:
      tags: [Products]
      summary: List products, or a single product via $filter
      operationId: listProducts
      parameters:
        - name: $filter
          in: query
          description: e.g. `productNo eq 'BSS001'` to fetch a single product.
          schema:
            type: string
          example: "productNo eq 'BSS001'"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'

  /api/ech/echgroup/v1.0/salesQuotes:
    get:
      tags: [Sales Quotes]
      summary: List sales quotes
      operationId: listSalesQuotes
      parameters:
        - $ref: '#/components/parameters/CompanyParam'
        - $ref: '#/components/parameters/ExpandLinesParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      $ref: '#/components/schemas/SalesQuote'
    post:
      tags: [Sales Quotes]
      summary: Create a sales quote
      operationId: createSalesQuote
      parameters:
        - $ref: '#/components/parameters/CompanyParam'
        - $ref: '#/components/parameters/ExpandLinesParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesQuoteCreate'
            example:
              customerNo: AGP-A00002
              orderDate: "2024-12-05"
              addressOne: Mekelle
              addressTwo: Mekelle
              requestedDeliveryDate: "2024-12-21"
              salesQuoteLines:
                - count: 100
                  type: Item
                  productNo: DOCS003
                  quantity: 1
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesQuote'

  /api/ech/echgroup/v1.0/salesQuotes/{quoteNo}:
    get:
      tags: [Sales Quotes]
      summary: Get a single sales quote
      operationId: getSalesQuote
      parameters:
        - $ref: '#/components/parameters/QuoteNoPathParam'
        - $ref: '#/components/parameters/CompanyParam'
        - $ref: '#/components/parameters/ExpandLinesParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesQuote'
    patch:
      tags: [Sales Quotes]
      summary: Update a sales quote
      operationId: updateSalesQuote
      parameters:
        - $ref: '#/components/parameters/QuoteNoPathParam'
        - $ref: '#/components/parameters/CompanyParam'
        - $ref: '#/components/parameters/ExpandLinesParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesQuoteUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesQuote'

  /ODataV4/Company('AGP%20Poultry%20PLC%20%28Ethiopia%29')/salesQuotes/{quoteNo}:
    patch:
      tags: [Sales Quotes]
      summary: Unblock a sales quote
      operationId: unblockSalesQuote
      parameters:
        - $ref: '#/components/parameters/QuoteNoPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                'Plate No.':
                  type: string
                  maxLength: 30
                externalDocumentNo:
                  type: string
                  maxLength: 35
                blocked:
                  type: boolean
            example:
              'Plate No.': "123764"
      responses:
        '200':
          description: OK

  /api/ech/echgroup/v1.0/salesOrders/{orderNo}:
    get:
      tags: [Sales Orders]
      summary: Get a single sales order
      operationId: getSalesOrder
      parameters:
        - name: orderNo
          in: path
          required: true
          description: The originating Quote No., not the Sales Order No.
          schema:
            type: string
            maxLength: 20
          example: HO-SQ-44416
        - $ref: '#/components/parameters/CompanyParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrder'
    patch:
      tags: [Sales Orders]
      summary: Update a sales order (delivery status, plate number, requested delivery date)
      operationId: updateSalesOrder
      parameters:
        - name: orderNo
          in: path
          required: true
          description: The originating Quote No., not the Sales Order No.
          schema:
            type: string
            maxLength: 20
          example: HO-SQ-44416
        - $ref: '#/components/parameters/CompanyParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesOrderUpdate'
            examples:
              deliveryStatusAndPlate:
                summary: Update delivery status / plate number
                value:
                  deliveryStatus: ASM: Customer ready to receive
                  PlateNo: "12314"
              deliveryDateAndStatus:
                summary: Update requested delivery date & status
                value:
                  requestedDeliveryDate: "2025-02-28"
                  deliveryStatus: ASM: Not Ready for Delivery
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesOrder'

  /ODataV4/Company('AGP%20Poultry%20PLC%20%28Ethiopia%29')/createPayment:
    post:
      tags: [Payments]
      summary: Create a payment
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
            example:
              date: "2025-02-21"
              externalDocumentNo: kjlkmlkjljoojkklAT15
              customerNo: AGP-A19800
              amount: 500000
              accountNo: B-ETB-CBE0001
              orderNo: HO-SO-100431
              attachmentUrl: WWW.EXAMPLE.COM
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'

  /ODataV4/Company('AGP%20Poultry%20PLC%20%28Ethiopia%29')/bankDetails:
    get:
      tags: [Reference Data]
      summary: List bank details
      operationId: listBankDetails
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      $ref: '#/components/schemas/BankDetail'

  /ODataV4/Company('AGP%20Poultry%20PLC%20%28Ethiopia%29')/salesPerson:
    get:
      tags: [Reference Data]
      summary: List sales persons, or a single one via $filter
      operationId: listSalesPersons
      parameters:
        - name: $filter
          in: query
          description: e.g. `code eq 'AA001'` to fetch a single sales person.
          schema:
            type: string
          example: "code eq 'AA001'"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      $ref: '#/components/schemas/SalesPerson'

  /ODataV4/Company('AGP%20Poultry%20PLC%20%28Ethiopia%29')/getGeography:
    get:
      tags: [Reference Data]
      summary: List geography reference data (post codes, territories, etc.)
      operationId: getGeography
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      $ref: '#/components/schemas/Geography'

  /ODataV4/Company('AGP%20Poultry%20PLC%20%28Ethiopia%29')/getSalesShipment:
    get:
      tags: [Reference Data]
      summary: List sales shipments
      operationId: getSalesShipment
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      type: object

  /ODataV4/Company('AGP%20Poultry%20PLC%20%28Ethiopia%29')/getBankLedger:
    get:
      tags: [Reference Data]
      summary: List bank ledger entries
      operationId: getBankLedger
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      type: object

  /ODataV4/Company('AGP%20Poultry%20PLC%20%28Ethiopia%29')/OrdersandItems:
    get:
      tags: [Reference Data]
      summary: List sales orders joined with their item lines
      operationId: getOrdersAndItems
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      type: object

  /ODataV4/Company('AGP%20Poultry%20PLC%20%28Ethiopia%29')/salesQuoteandItems:
    get:
      tags: [Reference Data]
      summary: List sales quotes joined with their item lines
      operationId: getSalesQuoteAndItems
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      type: object

components:
  parameters:
    CompanyParam:
      name: company
      in: query
      required: true
      description: Company name, used by the custom REST API instead of a path segment.
      schema:
        type: string
        default: AGP Poultry PLC (Ethiopia)
      example: AGP Poultry PLC (Ethiopia)
    ExpandLinesParam:
      name: $expand
      in: query
      description: Include related sales quote lines.
      schema:
        type: string
        default: salesQuoteLines
      example: salesQuoteLines
    QuoteNoPathParam:
      name: quoteNo
      in: path
      required: true
      schema:
        type: string
        maxLength: 20
      example: AD-SQ-24782

  schemas:
    Customer:
      type: object
      properties:
        customerNo:
          type: string
          maxLength: 20
          readOnly: true
        name:
          type: string
          maxLength: 100
        salesPersonCode:
          type: string
          maxLength: 20
        phoneNumber:
          type: string
          maxLength: 30
        phoneNumber2:
          type: string
          maxLength: 30
        email:
          type: string
          format: email
          maxLength: 80
          description: Customer email address.
        alternativePhoneNo:
          type: string
          maxLength: 30
        alternativePhoneNo2:
          type: string
          maxLength: 30
        country:
          type: string
          maxLength: 10
          description: Auto-populated from the post code lookup.
        territory:
          type: string
          maxLength: 10
          description: Auto-populated from the post code lookup.
        city:
          type: string
          maxLength: 30
          description: Auto-populated from the post code lookup.
        postCode:
          type: string
          maxLength: 20
          description: Auto-populated from the post code lookup.
        addressOne:
          type: string
          maxLength: 100
        addressTwo:
          type: string
          maxLength: 50
        balance:
          type: number
          format: double
          readOnly: true
        status:
          type: string
          maxLength: 20
          readOnly: true
          enum: [Open, Released, Pending Approval, Pending Prepayment]
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [Male, Female]
        tin:
          type: string
          maxLength: 40
        priceGroup:
          type: string
          maxLength: 10
        Agent_Kebele:
          type: string
          format: binary
          description: Document type of .jpg, .jpeg, .png, .pdf, .doc, .docx.
        Agent_Contact_Information:
          type: string
          format: binary
          description: Document type of .jpg, .jpeg, .png, .pdf, .doc, .docx.
        Standby_Person:
          type: string
          format: binary
          description: Document type of .jpg, .jpeg, .png, .pdf, .doc, .docx.
        Agreement:
          type: string
          format: binary
          description: Document type of .jpg, .jpeg, .png, .pdf, .doc, .docx.

    CustomerUpdate:
      type: object
      properties:
        customerNo:
          type: string
          maxLength: 20
          readOnly: true
        name:
          type: string
          maxLength: 100
        salesPersonCode:
          type: string
          maxLength: 20
        phoneNumber:
          type: string
          maxLength: 30
        phoneNumber2:
          type: string
          maxLength: 30
        email:
          type: string
          format: email
          maxLength: 80
        alternativePhoneNo:
          type: string
          maxLength: 30
        alternativePhoneNo2:
          type: string
          maxLength: 30
        country:
          type: string
          maxLength: 10
        territory:
          type: string
          maxLength: 10
        city:
          type: string
          maxLength: 30
        postCode:
          type: string
          maxLength: 20
        addressOne:
          type: string
          maxLength: 100
        addressTwo:
          type: string
          maxLength: 50
        balance:
          type: number
          format: double
          readOnly: true
        status:
          type: string
          maxLength: 20
          readOnly: true
          enum: [Open, Released, Pending Approval, Pending Prepayment]
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [Male, Female]
        tin:
          type: string
          maxLength: 40
        priceGroup:
          type: string
          maxLength: 10
        companyName:
          type: string
          description: Name of the companies.
        companyId:
          type: string
          format: uuid
          description: System ID (GUID) of the company.
        Agent_Kebele:
          type: string
          format: binary
        Agent_Contact_Information:
          type: string
          format: binary
        Standby_Person:
          type: string
          format: binary
        Agreement:
          type: string
          format: binary

    CustomerCreate:
      type: object
      required: [priceGroup]
      properties:
        name:
          type: string
          maxLength: 100
        salesPersonCode:
          type: string
          maxLength: 20
        phoneNumber:
          type: string
          maxLength: 30
          description: >
            Auto-reformatted to +251 XX XXX XXXX if given as a 10-digit
            local number starting with 0.
        phoneNumber2:
          type: string
          maxLength: 30
        alternativePhoneNo:
          type: string
          maxLength: 30
        alternativePhoneNo2:
          type: string
          maxLength: 30
        country:
          type: string
          maxLength: 10
        territory:
          type: string
          maxLength: 10
        city:
          type: string
          maxLength: 30
        postCode:
          type: string
          maxLength: 20
        addressOne:
          type: string
          maxLength: 100
        addressTwo:
          type: string
          maxLength: 50
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [Male, Female]
        tin:
          type: string
          maxLength: 40
        priceGroup:
          type: string
          enum: [AGENT, DEALER, AGENT-DEAL]
          description: >
            MANDATORY. Anything else throws "Invalid Price Group %1.
            Expected AGENT or DEALER."
        Agent_Kebele:
          type: string
          format: binary
        Agent_Contact_Information:
          type: string
          format: binary
        Standby_Person:
          type: string
          format: binary
        Agreement:
          type: string
          format: binary

    Product:
      type: object
      properties:
        priceGroup:
          type: string
          maxLength: 20
        productNo:
          type: string
          maxLength: 20
        name:
          type: string
          maxLength: 100
        unitOfMeasure:
          type: string
          maxLength: 10
        unitPrice:
          type: number
          format: double
          readOnly: true
        currencyCode:
          type: string
          maxLength: 10
        locationCode:
          type: string
          maxLength: 10
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        type:
          type: string
          maxLength: 20
          description: Gen. Prod. Posting Group.
        vatCode:
          type: string
          maxLength: 20
          description: VAT Prod. Posting Group.
        status:
          type: boolean
          description: Blocked (sign-reversed for display).
        salesStatus:
          type: boolean
          description: Sales Blocked.
        inventory:
          type: number
          format: double
          readOnly: true

    ProductNotification:
      type: object
      properties:
        companyName:
          type: string
          description: Name of the company in Business Central.
        companyId:
          type: string
          format: uuid
          description: System ID (GUID) of the company.
        productNo:
          type: string
          maxLength: 20
          description: Item "No." from Business Central.
        name:
          type: string
          maxLength: 100
          description: Item Description.
        type:
          type: string
          maxLength: 20
          description: General Product Posting Group.
        Unitmeasurement:
          type: string
          maxLength: 10
          description: Base Unit of Measure.
        ActionType:
          type: string
          description: Action triggered (e.g., Insert, Modify, Delete).

    PriceListLineNotification:
      type: object
      properties:
        companyName:
          type: string
          description: Name of the company in Business Central.
        companyId:
          type: string
          format: uuid
          description: System ID (GUID) of the company.
        productNo:
          type: string
          maxLength: 20
          description: Item "No." from Business Central.

    SalesQuote:
      type: object
      properties:
        quoteNo:
          type: string
        customerNo:
          type: string
        orderDate:
          type: string
          format: date
        requestedDeliveryDate:
          type: string
          format: date
        status:
          type: string
        salesQuoteLines:
          type: array
          items:
            $ref: '#/components/schemas/SalesQuoteLine'

    SalesQuoteLine:
      type: object
      properties:
        lineNo:
          type: integer
        count:
          type: integer
        type:
          type: string
        productNo:
          type: string
        quantity:
          type: number
          format: double

    SalesQuoteCreate:
      type: object
      properties:
        customerNo:
          type: string
        orderDate:
          type: string
          format: date
        addressOne:
          type: string
        addressTwo:
          type: string
        requestedDeliveryDate:
          type: string
          format: date
        salesQuoteLines:
          type: array
          items:
            $ref: '#/components/schemas/SalesQuoteLine'

    SalesQuoteUpdate:
      type: object
      properties:
        customerNo:
          type: string
        requestedDeliveryDate:
          type: string
          format: date
        status:
          type: string

    SalesOrder:
      type: object
      properties:
        orderNo:
          type: string
        quoteNo:
          type: string
        customerNo:
          type: string
        requestedDeliveryDate:
          type: string
          format: date
        deliveryStatus:
          type: string
        PlateNo:
          type: string

    SalesOrderUpdate:
      type: object
      properties:
        requestedDeliveryDate:
          type: string
          format: date
        deliveryStatus:
          type: string
        PlateNo:
          type: string

    Payment:
      type: object
      properties:
        id:
          type: string
        customerNo:
          type: string
        amount:
          type: number
          format: double
        date:
          type: string
          format: date

    PaymentCreate:
      type: object
      properties:
        date:
          type: string
          format: date
        externalDocumentNo:
          type: string
        customerNo:
          type: string
        amount:
          type: number
          format: double
        accountNo:
          type: string
